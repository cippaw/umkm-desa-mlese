<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Seller - UMKM Desa Mlese (DILAN)</title>
    <!-- Tailwind CSS v3 (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <!-- Dark/Light Theme Init -->
    <script src="js/theme.js"></script>
</head>
<body class="bg-gray-50 dark:bg-slate-950 text-gray-900 dark:text-white min-h-screen flex flex-col justify-between transition-colors duration-300">

    <!-- HEADER / NAVBAR -->
    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-gray-100 dark:border-slate-800 h-16 flex items-center justify-between px-4 sm:px-6 lg:px-8">
        <a href="index.html" class="flex items-center gap-3 group">
            <img src="assets/dilan-logo.png" alt="Logo DILAN Desa Mlese" class="h-10 w-auto object-contain dark:brightness-110">
        </a>
        <div class="flex items-center">
            <!-- theme.js will inject the toggle button here -->
        </div>
    </header>

    <!-- REGISTER CARD -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 p-8 rounded-3xl border border-gray-100 dark:border-slate-800 shadow-xl shadow-gray-150/40 dark:shadow-none w-full max-w-md">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-extrabold text-gray-800 dark:text-white">Daftar Akun Baru</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Buat akun untuk mengajukan profil UMKM dan mengunggah produk desa.</p>
            </div>

            <!-- Form -->
            <form id="register-form" class="space-y-4">
                <div>
                    <label for="username" class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider block mb-1">Nama Pengguna (Username)</label>
                    <input type="text" id="username" required placeholder="umkm_mlese" class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-850 text-sm text-gray-900 dark:text-white focus:border-red-600 focus:ring-2 focus:ring-red-500/20 outline-none transition-all">
                </div>
                <div>
                    <label for="email" class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider block mb-1">Email Aktif</label>
                    <input type="email" id="email" required placeholder="nama@email.com" class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-850 text-sm text-gray-900 dark:text-white focus:border-red-600 focus:ring-2 focus:ring-red-500/20 outline-none transition-all">
                </div>
                <div>
                    <label for="password" class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider block mb-1">Kata Sandi</label>
                    <input type="password" id="password" required placeholder="Minimal 6 karakter" class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-850 text-sm text-gray-900 dark:text-white focus:border-red-600 focus:ring-2 focus:ring-red-500/20 outline-none transition-all">
                </div>
                <button type="submit" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold text-sm rounded-xl transition-all shadow-md shadow-red-500/10">
                    Daftar Akun
                </button>
            </form>

            <div class="mt-6 border-t border-gray-100 dark:border-slate-800 pt-6 text-center text-xs text-gray-500 dark:text-gray-400">
                Sudah memiliki akun? 
                <a href="login.html" class="text-red-650 font-bold hover:text-red-700 ml-1 transition-colors">Masuk di sini ➔</a>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white dark:bg-slate-900 border-t border-gray-100 dark:border-slate-800 py-6 text-center text-[10px] text-gray-400 dark:text-gray-500">
        <p>© 2026 Pemerintah Desa Mlese. Didukung oleh DILAN (Desa Inovatif Lancar Administrasi).</p>
    </footer>

    <!-- Supabase SDK & JS scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
