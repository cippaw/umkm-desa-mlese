<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Pengguna - Dasbor Desa Mlese</title>
    <!-- Tailwind CSS v3 (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <!-- Dark/Light Theme Init -->
    <script src="../js/theme.js"></script>
</head>
<body class="bg-gray-50 dark:bg-slate-950 text-gray-900 dark:text-white min-h-screen flex flex-col md:flex-row transition-colors duration-300">

    <!-- SIDEBAR NAV (ADMIN) -->
    <aside class="w-full md:w-64 bg-slate-900 dark:bg-slate-955 text-slate-300 flex flex-col flex-shrink-0 border-r border-slate-800">
        <div class="h-16 flex items-center justify-between px-6 bg-slate-955 border-b border-slate-800">
            <span class="text-white font-extrabold text-base tracking-wider uppercase">Panel Admin Desa</span>
        </div>
        
        <div class="p-4 border-b border-slate-800 text-center md:text-left">
            <p class="text-xs text-slate-500 uppercase font-bold tracking-wider">Perangkat Desa,</p>
            <p class="text-sm font-bold text-white mt-1" id="admin-header-name">Memuat...</p>
        </div>

        <nav class="flex-grow p-4 space-y-1">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 dark:hover:bg-slate-900 hover:text-white text-sm transition-all">
                <i class="fa-solid fa-chart-line w-5"></i> Ringkasan Dasbor
            </a>
            <a href="verifikasi.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 dark:hover:bg-slate-900 hover:text-white text-sm transition-all">
                <i class="fa-solid fa-user-check w-5"></i> Verifikasi Pengajuan
            </a>
            <a href="kelola-umkm.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 dark:hover:bg-slate-900 hover:text-white text-sm transition-all">
                <i class="fa-solid fa-store w-5"></i> Kelola Semua UMKM
            </a>
            <a href="user.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-red-655 text-white font-semibold text-sm transition-all shadow-md shadow-red-500/10">
                <i class="fa-solid fa-users w-5"></i> Kelola Pengguna
            </a>
            <a href="statistik.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 dark:hover:bg-slate-900 hover:text-white text-sm transition-all">
                <i class="fa-solid fa-square-poll-vertical w-5"></i> Statistik Analitik
            </a>
        </nav>

        <div class="p-4 border-t border-slate-800 flex gap-2 items-center justify-between">
            <button id="logout-btn" class="flex-grow flex items-center justify-center gap-2 px-4 py-2.5 bg-red-955/40 hover:bg-red-955/60 text-red-200 border border-red-800/30 rounded-xl text-xs font-bold transition-all">
                <i class="fa-solid fa-right-from-bracket"></i> Keluar Sistem
            </button>
            <div class="flex items-center">
                <!-- theme.js will inject theme button here -->
            </div>
        </div>
    </aside>

    <!-- MAIN PANEL -->
    <main class="flex-grow p-6 md:p-8">
        
        <!-- Header Row -->
        <div class="border-b border-gray-200 dark:border-slate-855 pb-5 mb-8">
            <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white">Kelola Akun Pengguna</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Manajemen akun terdaftar pelaku usaha UMKM dan perangkat desa.</p>
        </div>

        <!-- Users Table Card -->
        <div class="bg-white dark:bg-slate-900 rounded-3xl border border-gray-100 dark:border-slate-800 overflow-hidden shadow-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-50 dark:bg-slate-850 text-gray-600 dark:text-gray-350 uppercase text-[10px] font-bold tracking-wider border-b border-gray-100 dark:border-slate-800">
                        <tr>
                            <th class="px-6 py-4">No</th>
                            <th class="px-6 py-4">Nama Pengguna</th>
                            <th class="px-6 py-4">Email</th>
                            <th class="px-6 py-4">Hak Akses (Role)</th>
                            <th class="px-6 py-4">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="admin-users-table-body" class="divide-y divide-gray-100 dark:divide-slate-800">
                        <!-- Loaded dynamically -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Supabase SDK & JS scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../products.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tableBody = document.getElementById('admin-users-table-body');
            if (tableBody) {
                let profiles = [];
                if (window.mleseDB.isDemo) {
                    profiles = JSON.parse(localStorage.getItem('mock_profiles') || '[]');
                }
                
                if (profiles.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="5" class="text-center py-8 text-gray-400">
                                Daftar pengguna hanya tersedia di Mode Demo offline atau setelah menghubungkan Supabase API.
                            </td>
                        </tr>
                    `;
                    return;
                }

                tableBody.innerHTML = '';
                profiles.forEach((u, idx) => {
                    const email = u.role === 'admin' ? 'admin@mlese.desa.id' : 'seller@mlese.desa.id';
                    const roleBadge = u.role === 'admin' 
                        ? `<span class="px-2 py-1 bg-red-100 dark:bg-red-950 text-red-800 dark:text-red-300 rounded-full text-[10px] font-bold">Admin</span>`
                        : `<span class="px-2 py-1 bg-blue-100 dark:bg-blue-950 text-blue-800 dark:text-blue-300 rounded-full text-[10px] font-bold">Seller (UMKM)</span>`;
                        
                    const row = `
                        <tr class="border-b border-gray-100 dark:border-slate-800 hover:bg-gray-50/50 dark:hover:bg-slate-850/50 transition-colors">
                            <td class="px-6 py-4 font-semibold text-gray-500">${idx + 1}</td>
                            <td class="px-6 py-4 font-bold text-gray-800 dark:text-white">${u.username}</td>
                            <td class="px-6 py-4 text-sm text-gray-600 dark:text-gray-300">${email}</td>
                            <td class="px-6 py-4">${roleBadge}</td>
                            <td class="px-6 py-4">
                                <button onclick="alert('Penghapusan akun langsung dibatasi demi keamanan demo!')" class="px-3 py-1.5 bg-red-50 dark:bg-red-950/20 text-red-650 dark:text-red-400 hover:bg-red-100 dark:hover:bg-red-950/50 rounded-lg text-xs font-bold transition-colors">
                                    Hapus
                                </button>
                            </td>
                        </tr>
                    `;
                    tableBody.insertAdjacentHTML('beforeend', row);
                });
            }
        });
    </script>
</body>
</html>
