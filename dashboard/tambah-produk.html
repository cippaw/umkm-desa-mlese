<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Produk Baru - Dasbor Desa Mlese</title>
    <!-- Tailwind CSS v3 (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <!-- Dark/Light Theme Init -->
    <script src="../js/theme.js"></script>
</head>
<body class="bg-gray-50 dark:bg-slate-950 text-gray-900 dark:text-white min-h-screen flex flex-col md:flex-row transition-colors duration-300">

    <!-- SIDEBAR NAV -->
    <aside class="w-full md:w-64 bg-slate-900 dark:bg-slate-955 text-slate-300 flex flex-col flex-shrink-0 border-r border-slate-800">
        <div class="h-16 flex items-center justify-between px-6 bg-slate-950 border-b border-slate-800">
            <span class="text-white font-extrabold text-base tracking-wider uppercase">Panel Pelaku Usaha</span>
        </div>
        
        <div class="p-4 border-b border-slate-800 text-center md:text-left">
            <p class="text-xs text-slate-500 uppercase font-bold tracking-wider">Selamat Datang,</p>
            <p class="text-sm font-bold text-white mt-1" id="user-display-name">Memuat...</p>
        </div>

        <nav class="flex-grow p-4 space-y-1">
            <a href="/dashboard/index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 dark:hover:bg-slate-900 hover:text-white text-sm transition-all">
                <i class="fa-solid fa-chart-line w-5"></i> Ringkasan Dasbor
            </a>
            <a href="/dashboard/profil.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 dark:hover:bg-slate-900 hover:text-white text-sm transition-all">
                <i class="fa-solid fa-store w-5"></i> Profil UMKM Anda
            </a>
            <a href="/dashboard/produk.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-red-650 text-white font-semibold text-sm transition-all shadow-md shadow-red-500/10">
                <i class="fa-solid fa-boxes-stacked w-5"></i> Kelola Produk
            </a>
            <a href="/dashboard/artikel.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 dark:hover:bg-slate-900 hover:text-white text-sm transition-all">
                <i class="fa-solid fa-newspaper w-5"></i> Artikel Kegiatan
            </a>
            <a href="/dashboard/galeri.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 dark:hover:bg-slate-900 hover:text-white text-sm transition-all">
                <i class="fa-solid fa-images w-5"></i> Galeri Foto Usaha
            </a>
            <a href="/dashboard/pengaturan.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 dark:hover:bg-slate-900 hover:text-white text-sm transition-all">
                <i class="fa-solid fa-gears w-5"></i> Pengaturan
            </a>
        </nav>

        <div class="p-4 border-t border-slate-800 flex gap-2 items-center justify-between">
            <button id="logout-btn" class="flex-grow flex items-center justify-center gap-2 px-4 py-2.5 bg-red-950/40 hover:bg-red-950/60 text-red-200 border border-red-800/30 rounded-xl text-xs font-bold transition-all">
                <i class="fa-solid fa-right-from-bracket"></i> Keluar Sistem
            </button>
            <div class="flex items-center">
                <!-- theme.js will inject theme button here -->
            </div>
        </div>
    </aside>

    <!-- MAIN PANEL -->
    <main class="flex-grow p-6 md:p-8">
        
        <!-- Header Row -->
        <div class="border-b border-gray-200 dark:border-slate-850 pb-5 mb-8">
            <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white">Tambah Produk Baru</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Unggah produk jualan baru lengkap dengan foto dan harga untuk katalog UMKM Anda.</p>
        </div>

        <!-- Form Card -->
        <div class="bg-white dark:bg-slate-900 rounded-3xl border border-gray-100 dark:border-slate-800 p-8 shadow-sm max-w-2xl">
            <form id="dashboard-add-product-form" class="space-y-5">
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="md:col-span-2">
                        <label for="product-name" class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider block mb-1">Nama Produk *</label>
                        <input type="text" id="product-name" required placeholder="Jenang Ketan Manis (Kemasan Box)" class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-805 text-sm text-gray-950 dark:text-white focus:border-red-650 focus:ring-2 focus:ring-red-500/20 outline-none transition-all">
                    </div>
                    <div>
                        <label for="product-price" class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider block mb-1">Estimasi Harga (Rp)</label>
                        <input type="number" id="product-price" placeholder="15000" class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-805 text-sm text-gray-955 dark:text-white focus:border-red-655 focus:ring-2 focus:ring-red-500/20 outline-none transition-all">
                    </div>
                </div>

                <div>
                    <label for="product-desc" class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider block mb-1">Deskripsi Singkat Produk *</label>
                    <textarea id="product-desc" required rows="3" placeholder="Sebutkan berat produk, rasa, bahan tambahan, atau detail pengemasan produk..." class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-805 text-sm text-gray-955 dark:text-white focus:border-red-655 focus:ring-2 focus:ring-red-500/20 outline-none transition-all"></textarea>
                </div>

                <div>
                    <label for="product-photo" class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider block mb-1">Foto Produk *</label>
                    <input type="file" id="product-photo" accept="image/*" required class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm text-gray-955 dark:text-white focus:border-red-655 focus:ring-2 focus:ring-red-500/20 outline-none transition-all">
                </div>

                <div class="pt-4 border-t border-gray-100 dark:border-slate-850 flex gap-4">
                    <button type="submit" class="px-6 py-3 bg-red-600 hover:bg-red-700 text-white font-bold text-sm rounded-xl transition-all shadow-md shadow-red-500/10">
                        Unggah Produk Baru
                    </button>
                    <a href="/dashboard/produk.html" class="px-6 py-3 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-gray-300 font-bold text-sm rounded-xl transition-all flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700">
                        Batal
                    </a>
                </div>

            </form>
        </div>

    </main>

    <!-- Supabase SDK & JS scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../products.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
