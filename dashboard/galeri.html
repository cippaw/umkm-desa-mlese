<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Foto Usaha - Dasbor Desa Mlese</title>
    <!-- Tailwind CSS v3 (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <!-- Dark/Light Theme Init -->
    <script src="../js/theme.js"></script>
</head>
<body class="bg-gray-50 dark:bg-slate-950 text-gray-900 dark:text-white min-h-screen flex flex-col md:flex-row transition-colors duration-300">

    <!-- SIDEBAR NAV -->
    <aside class="w-full md:w-64 bg-slate-900 dark:bg-slate-950 text-slate-300 flex flex-col flex-shrink-0 border-r border-slate-800">
        <div class="h-16 flex items-center justify-between px-6 bg-slate-950 border-b border-slate-800">
            <span class="text-white font-extrabold text-base tracking-wider uppercase">Panel Pelaku Usaha</span>
        </div>
        
        <div class="p-4 border-b border-slate-800 text-center md:text-left">
            <p class="text-xs text-slate-500 uppercase font-bold tracking-wider">Selamat Datang,</p>
            <p class="text-sm font-bold text-white mt-1" id="user-display-name">Memuat...</p>
        </div>

        <nav class="flex-grow p-4 space-y-1">
            <a href="/dashboard/index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 dark:hover:bg-slate-900 hover:text-white text-sm transition-all">
                <i class="fa-solid fa-chart-line w-5"></i> Ringkasan Dasbor
            </a>
            <a href="/dashboard/profil.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 dark:hover:bg-slate-900 hover:text-white text-sm transition-all">
                <i class="fa-solid fa-store w-5"></i> Profil UMKM Anda
            </a>
            <a href="/dashboard/produk.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 dark:hover:bg-slate-900 hover:text-white text-sm transition-all">
                <i class="fa-solid fa-boxes-stacked w-5"></i> Kelola Produk
            </a>
            <a href="/dashboard/artikel.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 dark:hover:bg-slate-900 hover:text-white text-sm transition-all">
                <i class="fa-solid fa-newspaper w-5"></i> Artikel Kegiatan
            </a>
            <a href="/dashboard/galeri.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-red-650 text-white font-semibold text-sm transition-all shadow-md shadow-red-500/10">
                <i class="fa-solid fa-images w-5"></i> Galeri Foto Usaha
            </a>
            <a href="/dashboard/pengaturan.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 dark:hover:bg-slate-900 hover:text-white text-sm transition-all">
                <i class="fa-solid fa-gears w-5"></i> Pengaturan
            </a>
        </nav>

        <div class="p-4 border-t border-slate-800 flex gap-2 items-center justify-between">
            <button id="logout-btn" class="flex-grow flex items-center justify-center gap-2 px-4 py-2.5 bg-red-950/40 hover:bg-red-950/60 text-red-200 border border-red-800/30 rounded-xl text-xs font-bold transition-all">
                <i class="fa-solid fa-right-from-bracket"></i> Keluar Sistem
            </button>
            <div class="flex items-center">
                <!-- theme.js will inject theme button here -->
            </div>
        </div>
    </aside>

    <!-- MAIN PANEL -->
    <main class="flex-grow p-6 md:p-8">
        
        <!-- Header Row -->
        <div class="border-b border-gray-200 dark:border-slate-850 pb-5 mb-8">
            <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white">Galeri Foto Usaha</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Daftar media visual produk milik UMKM Anda yang diunggah ke database.</p>
        </div>

        <!-- Gallery Grid -->
        <div class="bg-white dark:bg-slate-900 rounded-3xl border border-gray-100 dark:border-slate-800 p-8 shadow-sm">
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-6" id="dash-gallery-grid">
                <!-- Loaded dynamically -->
                <div class="col-span-full text-center text-gray-400 py-6">Memuat galeri foto...</div>
            </div>
        </div>

    </main>

    <!-- Supabase SDK & JS scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../products.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await window.mleseDB.getUser();
            if (!user) return;
            
            const galleryGrid = document.getElementById('dash-gallery-grid');
            if (galleryGrid) {
                const { data: list } = await window.mleseDB.getUMKMByUser(user.id);
                const userUMKM = list && list.length > 0 ? list[0] : null;

                if (!userUMKM) {
                    galleryGrid.innerHTML = `
                        <div class="col-span-full text-center text-gray-400 py-6">
                            Daftarkan profil UMKM Anda untuk memuat galeri foto produk.
                        </div>
                    `;
                    return;
                }

                const { data: products } = await window.mleseDB.getProductsByUMKM(userUMKM.id);
                
                if (!products || products.length === 0) {
                    galleryGrid.innerHTML = `
                        <div class="col-span-full text-center text-gray-400 py-6">
                            Belum ada foto produk yang diunggah. Unggah foto produk baru di menu Kelola Produk.
                        </div>
                    `;
                } else {
                    galleryGrid.innerHTML = '';
                    products.forEach(p => {
                        const imgHtml = `
                            <div class="group relative rounded-xl overflow-hidden border shadow-sm aspect-square bg-gray-50 dark:bg-slate-800 border-gray-100 dark:border-slate-700">
                                <img src="${p.image_url || p.image || '../assets/profil_dukuh.jpeg'}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.src='../assets/profil_dukuh.jpeg'">
                                <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex flex-col justify-end p-3 transition-opacity duration-300 text-white text-xs">
                                    <strong class="truncate block">${p.name}</strong>
                                    <span class="mt-0.5 text-red-300">Rp ${p.price || 'Katalog'}</span>
                                </div>
                            </div>
                        `;
                        galleryGrid.insertAdjacentHTML('beforeend', imgHtml);
                    });
                }
            }
        });
    </script>
</body>
</html>
